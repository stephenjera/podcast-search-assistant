[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podcast-eval"
version = "0.1.0"
description = "Offline benchmark harness for semantic search quality"
requires-python = ">=3.10"
dependencies = [
    "podcast-core>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["podcast_eval"]

[dependency-groups]
dev = ["ruff>=0.15.20"]

[tool.uv.sources]
podcast-core = { path = "../core" }
