[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podcast-pipeline"
version = "0.1.0"
description = "Ingestion pipeline: RSS, audio download, transcription, chunking, embeddings"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.2.1",
    "pydub>=0.25.1",
    "podcast-core>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["podcast_pipeline"]

[dependency-groups]
dev = ["ruff>=0.15.20"]

[tool.uv.sources]
podcast-core = { path = "../core" }
