[project]
name = "podcast-core"
version = "0.1.0"
description = "Shared local-podcast stack: config, DB, embeddings, shared read-path SQL"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podcast_core"]

[tool.uv]
package = true
